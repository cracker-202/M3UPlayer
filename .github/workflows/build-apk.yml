name: Build M3UPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Extract original project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="M3UPlayer (2).zip"
          test -f "$ZIP_FILE" || { echo "No se encontró $ZIP_FILE en la raíz del repositorio"; exit 1; }
          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source
          SETTINGS_FILE="$(find _source -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then SETTINGS_FILE="$(find _source -type f -name settings.gradle -print -quit)"; fi
          test -n "$SETTINGS_FILE" || { echo "El ZIP no contiene settings.gradle(.kts)"; find _source -maxdepth 4 -type f | head -100; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/gradlew" || { echo "No se encontró gradlew junto a settings.gradle"; exit 1; }
          test -d "$PROJECT_DIR/app" || { echo "No se encontró la carpeta app dentro del ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto localizado en: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3UPlayer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
