name: Build Zorrillo TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, cache-zorrillo-v15]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate catalog configuration
        env:
          CATALOG_URL: ${{ secrets.ZORRILLO_CATALOG_URL }}
        run: |
          python3 - <<'PYGEN'
          import os
          import json
          from pathlib import Path

          url = os.environ.get("CATALOG_URL", "")
          if not url:
              raise SystemExit("Falta ZORRILLO_CATALOG_URL")

          path = Path("app/src/main/java/com/example/m3uplayer/data/CatalogSource.kt")
          path.write_text(
              "package com.example.m3uplayer.data\n"
              "object CatalogSource {\n"
              "    const val URL = " + json.dumps(url) + "\n"
              "}\n"
          )
          PYGEN

      - name: Build Zorrillo TV
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Zorrillo TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorrillo-TV-1.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
